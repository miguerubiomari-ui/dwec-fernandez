<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interacción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
        <div class="container">
            <span class="navbar-brand">Parte B. Interacción (interaccion.html)</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                    aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Index</a></li>
                    <li class="nav-item"><a class="nav-link active" href="interaccion.html">Interacción</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card mx-auto shadow-sm" style="max-width: 600px;">
            <div class="card-header fw-semibold">Panel de botones</div>

            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button id="btn-mensaje" class="btn btn-primary">Mostrar mensaje</button>
                    <button id="btn-tema" class="btn btn-secondary">Cambiar tema</button>
                    <button id="btn-contador" class="btn btn-success">Sumar 1</button>
                </div>
                <p id="salida" class="fs-5 mb-0" aria-live="polite">Pulsa un botón.</p>
            </div>

            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <strong>Mostrar mensaje:</strong> escribe un saludo en la zona de resultado.
                </li>
                <li class="list-group-item">
                    <strong>Cambiar tema:</strong> alterna entre el tema claro y el oscuro de la página.
                </li>
                <li class="list-group-item">
                    <strong>Sumar 1:</strong> aumenta un contador y muestra su valor actual.
                </li>
            </ul>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
